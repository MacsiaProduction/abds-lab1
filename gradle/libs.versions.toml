[versions]
kotlin = "2.4.21"
ktor = "3.6.1"
serialization = "1.12.0"
coroutines = "1.11.0"
logback = "1.6.6"
slf4j = "2.0.20"
junit = "6.1.3"
assertj = "3.27.7"
netty = "4.2.19.Final"
io = "0.9.2"
ktlint = "1.8.0"
ktlintGradle = "14.2.0"

annotations = "26.1.0"
config = "1.4.10"
okio = "3.18.2"
kaml = "0.104.0"
# Kaml 0.104.0 requires the SnakeYAML 4.x ABI.
snakeyaml = "4.0.1"

[plugins]
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }

[libraries]
ktor-bom = { module = "io.ktor:ktor-bom", version.ref = "ktor" }
ktor-netty = { module = "io.ktor:ktor-server-netty" }
ktor-json = { module = "io.ktor:ktor-serialization-kotlinx-json" }
ktor-negotiation = { module = "io.ktor:ktor-server-content-negotiation" }
ktor-status = { module = "io.ktor:ktor-server-status-pages" }
ktor-test = { module = "io.ktor:ktor-server-test-host" }
serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
logback = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
slf4j = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
netty-bom = { module = "io.netty:netty-bom", version.ref = "netty" }
io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "io" }
io-bytestring = { module = "org.jetbrains.kotlinx:kotlinx-io-bytestring", version.ref = "io" }

kotlin-bom = { module = "org.jetbrains.kotlin:kotlin-bom", version.ref = "kotlin" }
annotations = { module = "org.jetbrains:annotations", version.ref = "annotations" }
typesafe-config = { module = "com.typesafe:config", version.ref = "config" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
okio-jvm = { module = "com.squareup.okio:okio-jvm", version.ref = "okio" }
kaml = { module = "com.charleskorn.kaml:kaml", version.ref = "kaml" }
kaml-jvm = { module = "com.charleskorn.kaml:kaml-jvm", version.ref = "kaml" }
snakeyaml = { module = "it.krzeminski:snakeyaml-engine-kmp", version.ref = "snakeyaml" }
snakeyaml-jvm = { module = "it.krzeminski:snakeyaml-engine-kmp-jvm", version.ref = "snakeyaml" }
