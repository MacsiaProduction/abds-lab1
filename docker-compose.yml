services:
  clickhouse:
    image: ${CLICKHOUSE_IMAGE:?}
    env_file: .env.local
    ports:
      - "${CLICKHOUSE_HTTP_PORT}:${CLICKHOUSE_HTTP_PORT}"
      - "${CLICKHOUSE_PORT}:${CLICKHOUSE_PORT}"
    volumes:
      - ./volume:/var/lib/clickhouse
      - ./docker/ports.xml:/etc/clickhouse-server/config.d/ports.xml:ro
    healthcheck:
      test: ["CMD-SHELL", 'clickhouse-client --host 127.0.0.1 --port "$${CLICKHOUSE_PORT}" --user "$${CLICKHOUSE_USER}" --password "$${CLICKHOUSE_PASSWORD}" --query "SELECT 1"']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
  app:
    build:
      context: .
      args:
        JDK_IMAGE: ${JDK_IMAGE:?}
    env_file: .env.local
    environment:
      CLICKHOUSE_HOST: clickhouse
    ports:
      - "${APP_PORT}:${APP_PORT}"
    volumes:
      - ./data:/app/data
    depends_on:
      clickhouse:
        condition: service_healthy
